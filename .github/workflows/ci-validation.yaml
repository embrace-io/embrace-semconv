name: CI validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-registry:
    name: Validate registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read pinned weaver version
        id: weaver
        run: |
          source versions.env
          echo "version=$WEAVER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Weaver
        uses: ./.github/actions/setup-weaver
        with:
          version: ${{ steps.weaver.outputs.version }}

      - name: Validate the registry (dependencies + schema + policies)
        run: make validate-registry

  validate-docs:
    name: Validate docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read pinned weaver version
        id: weaver
        run: |
          source versions.env
          echo "version=$WEAVER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Weaver
        uses: ./.github/actions/setup-weaver
        with:
          version: ${{ steps.weaver.outputs.version }}

      - name: Regenerate docs
        run: make generate-all

      - name: Compare committed docs with the regenerated ones
        uses: ./.github/actions/assert-no-drift
        with:
          path: docs
          label: docs
          regenerate-hint: |
            make install-weaver   # once, if weaver is not on PATH
            make generate-all
            git add docs/

  test-templates:
    name: Test templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read pinned weaver version
        id: weaver
        run: |
          source versions.env
          echo "version=$WEAVER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Weaver
        uses: ./.github/actions/setup-weaver
        with:
          version: ${{ steps.weaver.outputs.version }}

      - name: Compare the docs rendered from the fixture with the golden files
        run: make test-templates

  test-policies:
    name: Test policies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read pinned OPA version
        id: opa
        run: |
          source versions.env
          echo "version=$OPA_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install OPA
        uses: ./.github/actions/setup-opa
        with:
          version: ${{ steps.opa.outputs.version }}

      - name: Unit-test rego policies
        run: make test-policies

  test-validations:
    name: Test validations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read pinned weaver version
        id: weaver
        run: |
          source versions.env
          echo "version=$WEAVER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Weaver
        uses: ./.github/actions/setup-weaver
        with:
          version: ${{ steps.weaver.outputs.version }}

      - name: Confirm validation fails on each invalid registry in validations_test/
        run: make test-validations

  # Aggregate gate for branch protection: require only this job. Branch protection on main requires
  # a status check named `required-status-check`, so keep this job's name identical to its id.
  required-status-check:
    name: required-status-check
    if: always()
    needs:
      - validate-registry
      - validate-docs
      - test-templates
      - test-policies
      - test-validations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any dependency did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
