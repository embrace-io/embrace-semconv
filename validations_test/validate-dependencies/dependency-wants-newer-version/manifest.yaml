# Depends on core 1.43.0 directly and, through newer-core, on core 1.44.0. Weaver uses 1.44.0 and
# warns, so this registry runs against a core other than the one it declares.

schema_url: https://embrace.io/schemas/validations-test-case/0.0.0-dev
description: Case where a dependency requests a newer version of a registry than this one.
stability: development
dependencies:
  - schema_url: https://embrace.io/schemas/validations-test-newer-core/0.0.0-dev
    registry_path: validations_test/registries/newer-core
  - schema_url: https://opentelemetry.io/schemas/1.43.0
    registry_path: https://github.com/open-telemetry/semantic-conventions@v1.43.0[model]
