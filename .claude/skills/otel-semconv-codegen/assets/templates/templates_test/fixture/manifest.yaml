# Fixture registry for the template regression test. Never published.
#
# It holds one fixture file per kind of convention the project supports (attributes, attribute
# groups, events, ...), so each template has something to render. The attributes file defines the
# fixture's own attributes, in a public group of their own; every other file references the core
# registry's attributes, so any combination resolves. Most also import from the core registry, so
# the templates' provenance filters have something to filter out: a real registry often has no
# `imports` block, so a broken filter would be invisible there.
#
# Keep the core registry at the release the source registry depends on. The `# renovate:` line
# stays only where Renovate bumps that release under the same depName elsewhere too (the source
# registry is the core registry, or the project's own manifest pins it the same way); otherwise it
# is deleted, and the release moves by hand with the source registry: Renovate mustn't move it
# alone.
#
# No `file_format` line: weaver 0.28 warns that one is missing, but the value it asks for
# (`definition_manifest/2.0`) is one older weaver releases reject, so the fixture loads on both.

schema_url: https://example.com/schemas/templates-fixture/0.0.0-dev
description: Fixture registry exercising every kind of convention the templates render.
stability: development
dependencies:
  # renovate: datasource=github-tags depName=open-telemetry/semantic-conventions versioning=semver-coerced
  - schema_url: https://opentelemetry.io/schemas/@@CORE_VERSION@@
    registry_path: https://github.com/open-telemetry/semantic-conventions@v@@CORE_VERSION@@[model]
