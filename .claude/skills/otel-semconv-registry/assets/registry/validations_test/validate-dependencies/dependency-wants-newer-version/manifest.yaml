# Depends on the core registry at version @@CORE_OLDER_VERSION@@ directly, and through newer-core
# at version @@CORE_VERSION@@. Weaver uses @@CORE_VERSION@@ and warns, so this registry runs
# against a core registry version other than the one it declares.

schema_url: https://example.com/schemas/validations-test-case/0.0.0-dev
description: Case where a dependency requests a newer version of a registry than this one.
stability: development
dependencies:
  - schema_url: https://example.com/schemas/validations-test-newer-core/0.0.0-dev
    registry_path: validations_test/registries/newer-core
  - schema_url: https://opentelemetry.io/schemas/@@CORE_OLDER_VERSION@@
    registry_path: https://github.com/open-telemetry/semantic-conventions@v@@CORE_OLDER_VERSION@@[model]
