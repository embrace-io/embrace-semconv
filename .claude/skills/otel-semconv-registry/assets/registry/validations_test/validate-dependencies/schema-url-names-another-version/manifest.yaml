# Declares core registry @@CORE_VERSION@@ but fetches the v@@CORE_OLDER_VERSION@@ tag.

schema_url: https://example.com/schemas/validations-test-case/0.0.0-dev
description: Case where a dependency's schema_url names a different version than it fetches.
stability: development
dependencies:
  - schema_url: https://opentelemetry.io/schemas/@@CORE_VERSION@@
    registry_path: https://github.com/open-telemetry/semantic-conventions@v@@CORE_OLDER_VERSION@@[model]
