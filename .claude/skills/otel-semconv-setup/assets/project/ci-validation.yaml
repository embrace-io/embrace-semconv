# Jobs are grouped into the same features as the Makefile's sections, between
# `# ==== <feature>` and `# ==== end <feature>` lines, and the aggregate job at the end needs
# every job above it.
name: @@CI_WORKFLOW_NAME@@

# No `paths:` filter: the aggregate job is a required check, and a required check that never runs
# blocks the pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The directory holding the project's Makefile, relative to the repo root.
defaults:
  run:
    working-directory: @@PROJECT_DIR@@

jobs:
  # ==== templates
  test-templates:
    name: Test templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned weaver version
        id: weaver
        run: |
          source versions.env
          echo "version=$WEAVER_VERSION" >> "$GITHUB_OUTPUT"

      # `$/` is GitHub's syntax for this repository's own actions, at the commit running.
      - name: Install Weaver
        uses: $/.github/actions/setup-weaver
        with:
          version: ${{ steps.weaver.outputs.version }}

      - name: Compare what the templates render from the fixture with the golden files
        run: make test-templates
  # ==== end templates

  # ==== registry
  validate-registry:
    name: Validate registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned weaver version
        id: weaver
        run: |
          source versions.env
          echo "version=$WEAVER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Weaver
        uses: $/.github/actions/setup-weaver
        with:
          version: ${{ steps.weaver.outputs.version }}

      # ==== private
      # A private repo: git asks gh for credentials, and gh answers with GH_TOKEN, which only the
      # steps that fetch are given. No token is ever written into a URL.
      - name: Let git use the workflow's token
        run: gh auth setup-git
        env:
          GH_TOKEN: ${{ github.token }}
      # ==== end private

      - name: Validate the registry (dependencies + schema + policies)
        # ==== private
        env:
          GH_TOKEN: ${{ github.token }}
        # ==== end private
        run: make validate-registry

  test-validations:
    name: Test validations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned weaver version
        id: weaver
        run: |
          source versions.env
          echo "version=$WEAVER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Weaver
        uses: $/.github/actions/setup-weaver
        with:
          version: ${{ steps.weaver.outputs.version }}

      - name: Confirm validation fails on each invalid registry in validations_test/
        run: make test-validations

  # ==== attributes
  test-policies:
    name: Test policies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned OPA version
        id: opa
        run: |
          source versions.env
          echo "version=$OPA_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install OPA
        uses: $/.github/actions/setup-opa
        with:
          version: ${{ steps.opa.outputs.version }}

      - name: Unit-test rego policies
        run: make test-policies
  # ==== end attributes
  # ==== end registry

  # ==== docs
  validate-docs:
    name: Validate docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned weaver version
        id: weaver
        run: |
          source versions.env
          echo "version=$WEAVER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Weaver
        uses: $/.github/actions/setup-weaver
        with:
          version: ${{ steps.weaver.outputs.version }}

      # ==== private
      - name: Let git use the workflow's token
        run: gh auth setup-git
        env:
          GH_TOKEN: ${{ github.token }}
      # ==== end private

      - name: Regenerate docs
        # ==== private
        env:
          GH_TOKEN: ${{ github.token }}
        # ==== end private
        run: make generate-docs

      - name: Compare committed docs with the regenerated ones
        uses: $/.github/actions/assert-no-drift
        with:
          path: @@DOCS_REPO_PATH@@
          label: docs
          regenerate-hint: |
            make -C @@PROJECT_DIR@@ install-weaver   # once, if weaver is not on PATH
            make -C @@PROJECT_DIR@@ generate-docs
            git add @@DOCS_REPO_PATH@@/
  # ==== end docs

  # ==== codegen
  # The platform's toolchain setup (an actions/setup-* action, e.g. setup-java, whose
  # `cache: gradle` stands in for gradle/actions/setup-gradle, or setup-node) goes before the
  # validate step, with its own `working-directory:` when it must run elsewhere (e.g. `npm ci` at
  # the repo root); raise timeout-minutes for slow builds (a cold Gradle build). The compare step
  # is only for committed generated code.
  validate-generated:
    name: Validate generated code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned weaver version
        id: weaver
        run: |
          source versions.env
          echo "version=$WEAVER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Weaver
        uses: $/.github/actions/setup-weaver
        with:
          version: ${{ steps.weaver.outputs.version }}

      # ==== private
      - name: Let git use the workflow's token
        run: gh auth setup-git
        env:
          GH_TOKEN: ${{ github.token }}
      # ==== end private

      - name: Regenerate the code
        # ==== private
        env:
          GH_TOKEN: ${{ github.token }}
        # ==== end private
        run: make generate

      - name: Compare committed code with the regenerated code
        uses: $/.github/actions/assert-no-drift
        with:
          path: @@GENERATED_REPO_PATH@@
          label: generated code
          regenerate-hint: |
            make -C @@PROJECT_DIR@@ install-weaver   # once, if weaver is not on PATH
            make -C @@PROJECT_DIR@@ generate
            git add @@GENERATED_REPO_PATH@@/

      # Both rerun `make generate` first, so they fetch too.
      - name: Validate the generated code
        # ==== private
        env:
          GH_TOKEN: ${{ github.token }}
        # ==== end private
        run: make validate-generated

      - name: Package the generated code
        # ==== private
        env:
          GH_TOKEN: ${{ github.token }}
        # ==== end private
        run: make package-generated
  # ==== end codegen

  # Aggregate gate for branch protection: require only this job. Branch protection sees a job by
  # its `name:`, so keep the name identical to the id, unique among the repo's workflows, and name
  # it in the protection rule.
  @@CI_GATE_JOB@@:
    name: @@CI_GATE_JOB@@
    if: always()
    # No checkout here, so the project directory doesn't exist.
    defaults:
      run:
        working-directory: .
    needs:
      - test-templates # templates
      - validate-registry # registry
      - test-validations # registry
      - test-policies # registry attributes
      - validate-docs # docs
      - validate-generated # codegen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any dependency did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
