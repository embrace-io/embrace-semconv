# Imports a group that no dependency exports. Weaver only warns, and wraps the warning to the
# terminal width, so the unmatched-import validation reads weaver's JSON diagnostics instead of its
# text. The group ID is long enough that the text version wraps.

schema_url: https://example.com/schemas/validations-test-case/0.0.0-dev
description: Case whose import matches nothing in any dependency.
stability: development
dependencies:
  - schema_url: https://opentelemetry.io/schemas/@@CORE_VERSION@@
    registry_path: https://github.com/open-telemetry/semantic-conventions@v@@CORE_VERSION@@[model]
