# Jobs are grouped into the same parts as the Makefile's sections, between `# ==== <part>` and
# `# ==== end <part>` lines, and the aggregate job at the end needs every job above it.
# `uses: $/…` is GitHub's syntax for this repository's own actions, at the commit running.
name: @@CI_WORKFLOW_NAME@@

# No `paths:` filter: the aggregate job is a required check, and a required check that never runs
# blocks the pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The directory holding the project's Makefile, relative to the repo root.
defaults:
  run:
    working-directory: @@PROJECT_DIR@@

jobs:
  # ==== templates
  test-templates:
    name: Test templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned weaver version
        id: weaver
        run: |
          source versions.env
          echo "version=$WEAVER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@51a5bf95bdbb2e20fb6e16638e6bbe7dde911e93 # v0.28.0
        with:
          version: ${{ steps.weaver.outputs.version }}

      - name: Compare what the templates render from the fixture with the golden files
        run: make test-templates
  # ==== end templates

  # Aggregate gate for branch protection: require only this job. Branch protection sees a job by
  # its `name:`, so keep the name identical to the id, unique among the repo's workflows, and name
  # it in the protection rule.
  @@CI_GATE_JOB@@:
    name: @@CI_GATE_JOB@@
    if: always()
    # No checkout here, so the project directory doesn't exist.
    defaults:
      run:
        working-directory: .
    needs:
      - test-templates # templates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any dependency did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
